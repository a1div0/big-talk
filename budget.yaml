# Бюджет сложности. Превышение — ошибка CI.
# Цель: система, которую медианно компетентный гражданин может прочитать за один вечер,
# а медианно компетентное должностное лицо — исполнить без юриста.
spec_words: 20000            # суммарный объём тел всех EL
normative_words: 40000       # суммарный объём нормативных текстов
elements: 25                 # число элементов системы
roles: 15                    # число различных должностных ролей (ACT с kind: role)
max_depends_depth: 4         # глубина цепочки depends_on
max_links_per_element: 14    # перекрёстные ссылки у одного элемента
exceptions: 20               # число пунктов «Исключение:» во всех EL
